<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watching Movies & Anime</title>
  <style>
    :root {
      --spidey-red: #E0202D;
      --spidey-blue: #0B1E3D;
      --web-white: #F1EEE2;
      --ink: #0A0A0A;
      --accent-yellow: #F3B62B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(11, 30, 61, 0.68), rgba(224, 32, 45, 0.72)),
        url('movies_anime.jpg') center / cover no-repeat;
      color: var(--web-white);
      font-family: Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }
    body::before,
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    body::before {
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.24), transparent 20%),
        radial-gradient(circle at 80% 15%, rgba(243,182,43,0.24), transparent 18%),
        linear-gradient(120deg, rgba(255,255,255,0.10), transparent 45%, rgba(255,255,255,0.05));
      mix-blend-mode: screen;
      animation: glow 10s ease-in-out infinite alternate;
    }
    body::after {
      background-image:
        linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
      opacity: 0.26;
      animation: scan 6s linear infinite;
    }
    .card {
      width: min(760px, 100%);
      max-height: 92vh;
      background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.08));
      border: 3px solid var(--ink);
      border-radius: 24px;
      padding: 28px 24px 24px;
      box-shadow: 12px 12px 0 rgba(0,0,0,0.38), inset 0 0 0 1px rgba(255,255,255,0.16);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
      overflow: auto;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(255,255,255,0.22);
      border-radius: 18px;
      pointer-events: none;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 2.5vw, 2.3rem);
      color: var(--accent-yellow);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.24);
    }
    p { line-height: 1.7; margin: 0 0 12px; }
    .section-box {
      margin-top: 18px;
      padding: 16px;
      border: 2px solid rgba(10,10,10,0.2);
      border-radius: 18px;
      background: rgba(241,238,226,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }
    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent-yellow);
      margin: 0 0 12px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .video-grid.clips-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .video-card {
      border: 2px solid rgba(10,10,10,0.18);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 10px 18px rgba(0,0,0,0.16);
      padding: 6px;
    }
    .video-card video {
      display: block;
      width: 100%;
      height: 95px;
      object-fit: cover;
      object-position: center;
      border-radius: 8px;
      background: var(--ink);
    }
    .video-card video:fullscreen {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      transform: rotate(-90deg);
      transform-origin: center;
      background: #000;
    }
    .video-card video::-webkit-media-controls-panel {
      background: rgba(0,0,0,0.8);
    }
    .video-label {
      display: block;
      text-align: center;
      font-size: 0.8rem;
      color: var(--ink);
      font-weight: 700;
      padding: 6px 4px 2px;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 16px;
      background: var(--accent-yellow);
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      border-radius: 999px;
      box-shadow: 0 10px 20px rgba(243,182,43,0.18);
    }
    @keyframes glow {
      0% { transform: scale(1); opacity: 0.95; }
      100% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes scan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Trailers and Clips</h1>
    <p>Enjoy Watching :]</p>

    <div class="section-box">
      <div class="section-title">Trailers</div>
      <div class="video-grid">
        <div class="video-card">
          <video controls preload="metadata" poster="poster1.jpg">
            <source src="trailer1.mp4" type="video/mp4">
          </video>
          <span class="video-label">Justice League</span>
        </div>
        <div class="video-card">
          <video controls preload="metadata" poster="poster2.jpg">

          </video>
          <span class="video-label">Avengers Doomsday</span>
        </div>
        <div class="video-card">
          <video controls preload="metadata" poster="poster3.jpg">
            <source src="trailer3.mp4" type="video/mp4">
          </video>
          <span class="video-label">Mission Impossible 8</span>
        </div>
      </div>
    </div>

    <div class="section-box">
      <div class="section-title">Clips</div>
      <div class="video-grid clips-grid">
        <div class="video-card">
          <video controls preload="metadata" poster="poster-edit1.jpg">
            <source src="edit1.mp4" type="video/mp4">
          </video>
          <span class="video-label">Clip 1</span>
        </div>
        <div class="video-card">
          <video controls preload="metadata" poster="poster-edit2.jpg">
            <source src="edit2.mp4" type="video/mp4">
          </video>
          <span class="video-label">Clip 2</span>
        </div>
        <div class="video-card">
          <video controls preload="metadata" poster="poster-edit3.jpg">
            <source src="edit3.mp4" type="video/mp4">
          </video>
          <span class="video-label">Clip 3</span>
        </div>
        <div class="video-card">
          <video controls preload="metadata" poster="poster-edit4.jpg">
            <source src="edit4.mp4" type="video/mp4">
          </video>
          <span class="video-label">Clip 4</span>
        </div>
        <div class="video-card">
          <video controls preload="metadata" poster="poster-edit5.jpg">
            <source src="edit5.mp4" type="video/mp4">
          </video>
          <span class="video-label">Clip 5</span>
        </div>
        <div class="video-card">
          <video controls preload="metadata" poster="poster-edit6.jpg">
            <source src="edit6.mp4" type="video/mp4">
          </video>
          <span class="video-label">Clip 6</span>
        </div>
        <div class="video-card">
          <video controls preload="metadata" poster="poster-edit7.jpg">
            <source src="edit7.mp4" type="video/mp4">
          </video>
          <span class="video-label">Clip 7</span>
        </div>
        <div class="video-card">
          <video controls preload="metadata" poster="poster-edit8.jpg">
            <source src="edit8.mp4" type="video/mp4">
          </video>
          <span class="video-label">Clip 8</span>
        </div>
      </div>
    </div>

    <a class="btn" href="./index.html#hobbies" target="_self" rel="noopener">Back to Hobbies</a>
  </div>
</body>
</html>
