    <meta charset="UTF-8">

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🌿 Cleansing <span>Impurities</span>
    </div>

   <nav class="nav-links">

         <a href="index.html">Home</a>

        <a href="learn.html">Learn</a>

        <a href="programs.html">Programs</a>

        <a href="groupchat.html">Community</a>

        <a href="report.html" class="active">Report</a>

        <a href="donation.html">Donate</a>

        <a href="impact.html">Impact</a>

        <a href="profile.html">Profile</a>

    </nav>
    <button id="theme-toggle" class="theme-btn">
    <i class="fa-solid fa-moon"></i>
</button>
</header>

<section class="page-hero" data-aos="fade-up">

    <h1>Report an Environmental Issue</h1>

    <p>
        Help your community by reporting environmental concerns.
    </p>

</section>

<section class="report-container" data-aos="zoom-in">

<form id="reportForm">

<label for="fullname">Full Name</label>

<input
type="text"
id="fullname"
name="fullname"
placeholder="Enter your name"
required>

<label for="email">Email</label>

<input
type="email"
id="email"
name="email"
placeholder="Enter your email"
required>

<label for="issue">Issue Type</label>

<select
id="issue"
name="issue"
required>
    <option value="">Select an issue</option>
    <option>Illegal Dumping</option>
    <option>Open Burning</option>
    <option>Water Pollution</option>
    <option>Air Pollution</option>
    <option>Illegal Logging</option>
    <option>Others</option>
</select>

<label for="location">Location</label>

<input
type="text"
id="location"
name="location"
placeholder="Enter the location"
required>

<label for="description">Description</label>

<textarea
id="description"
name="description"
placeholder="Describe the issue..."
rows="6"
required>
</textarea>

<label for="photo">Upload Photo</label>

<input
type="file"
id="photo"
name="photo"
accept="image/*">

<button type="submit" class="btn">
Submit Report
</button>

</form>

</section>

<footer>

<p>© 2026 Cleansing Impurities</p>

</footer>

<script src="js/report.js"></script>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>
AOS.init({
    duration: 900,
    once: true,
    offset: 100
});
</script>

<button id="topBtn">
    ↑
</button>

</body>
</html>
