<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing</title>
  <style>
    :root {
      --spidey-red: #E0202D;
      --spidey-blue: #0B1E3D;
      --web-white: #F1EEE2;
      --ink: #0A0A0A;
      --accent-yellow: #F3B62B;
    }
    * { box-sizing: border-box; }
    html {
      min-height: 100%;
    }
    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.1), transparent 19%),
        radial-gradient(circle at 85% 15%, rgba(243, 182, 43, 0.16), transparent 18%),
        linear-gradient(135deg, rgba(224, 32, 45, 0.82), rgba(11, 30, 61, 0.82)),
        url('Drawing_Background.jpg') center / cover fixed no-repeat;
      color: var(--web-white);
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow-y: auto;
      position: relative;
    }
    body::before,
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      background:
        radial-gradient(circle at 24% 14%, rgba(255,255,255,0.20), transparent 16%),
        radial-gradient(circle at 70% 12%, rgba(255,255,255,0.08), transparent 18%);
      mix-blend-mode: screen;
      animation: drift 16s ease-in-out infinite alternate;
    }
    body::after {
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 32px),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0 1px, transparent 1px 22px);
      opacity: 0.24;
      animation: scan 9s linear infinite;
    }
    .card {
      width: min(980px, 100%);
      margin: 0 auto;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 28px;
      padding: 34px;
      box-shadow: 0 28px 72px rgba(0,0,0,0.28);
      backdrop-filter: blur(18px);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: -28px;
      right: -28px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(243,182,43,0.32), transparent 55%);
      filter: blur(20px);
      pointer-events: none;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 3vw, 3rem);
      color: var(--accent-yellow);
      letter-spacing: 1px;
      position: relative;
    }
    h1::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -10px;
      width: 72px;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(243,182,43,0.95), rgba(255,255,255,0.6));
      box-shadow: 0 0 24px rgba(243,182,43,0.5);
    }
    p {
      line-height: 1.75;
      color: rgba(241,238,226,0.93);
      max-width: 760px;
      margin: 0;
    }
    .gallery {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }
    .gallery-item {
      position: relative;
      padding: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(241,238,226,0.88));
      border: 1px solid rgba(10,10,10,0.18);
      border-radius: 24px;
      box-shadow: 0 24px 40px rgba(0,0,0,0.14);
      transform: translateY(0);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }
    .gallery-item:hover {
      transform: translateY(-6px) rotate(0deg);
      box-shadow: 0 32px 50px rgba(0,0,0,0.2);
    }
    .gallery-item:nth-child(odd) {
      transform: rotate(-1deg);
    }
    .gallery-item:nth-child(even) {
      transform: rotate(1deg);
    }
    .gallery-item::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 10px;
      width: calc(100% - 20px);
      height: calc(100% - 20px);
      border: 1px dashed rgba(10,10,10,0.12);
      border-radius: 20px;
      pointer-events: none;
    }
    .gallery-item::after {
      content: "";
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, rgba(243,182,43,0.4), transparent 60%);
      filter: blur(6px);
      pointer-events: none;
    }
    .gallery-item img {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 18px;
      border: 2px solid rgba(10,10,10,0.12);
      cursor: pointer;
      transition: transform 0.25s ease, filter 0.25s ease;
    }
    .gallery-item img:hover {
      transform: scale(1.03);
      filter: brightness(1.08);
    }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10,10,10,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 95%;
      max-height: 90%;
      border: 4px solid rgba(241,238,226,0.9);
      box-shadow: 0 0 48px rgba(243,182,43,0.4);
      border-radius: 18px;
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--web-white);
      background: rgba(0,0,0,0.45);
      color: var(--web-white);
      font-size: 1.5rem;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      padding: 12px 18px;
      background: linear-gradient(135deg, rgba(243,182,43,1), rgba(255,255,255,0.95));
      color: var(--ink);
      text-decoration: none;
      font-weight: 800;
      border-radius: 999px;
      box-shadow: 0 14px 30px rgba(243,182,43,0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(243,182,43,0.24);
    }
    @keyframes drift {
      0% { transform: translate3d(0,0,0) scale(1); }
      100% { transform: translate3d(-2%, 2%, 0) scale(1.04); }
    }
    @keyframes scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(22px); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Drawing Samples</h1>
    <div class="gallery">
      <div class="gallery-item"><img src="image1.jpg" alt="Drawing artwork 1"></div>
      <div class="gallery-item"><img src="image2.jpg" alt="Drawing artwork 2"></div>
      <div class="gallery-item"><img src="imgae3.jpg" alt="Drawing artwork 3"></div>
      <div class="gallery-item"><img src="imgae4.jpg" alt="Drawing artwork 4"></div>
      <div class="gallery-item"><img src="imgae5.jpg" alt="Drawing artwork 5"></div>
      <div class="gallery-item"><img src="imgae6.jpg" alt="Drawing artwork 6"></div>
      <div class="gallery-item"><img src="imgae7.jpg" alt="Drawing artwork 7"></div>
      <div class="gallery-item"><img src="imgae8.jpg" alt="Drawing artwork 8"></div>
      <div class="gallery-item"><img src="imgae9.jpg" alt="Drawing artwork 9"></div>
      <div class="gallery-item"><img src="imgae10.jpg" alt="Drawing artwork 10"></div>
    </div>
    <a class="btn" href="./index.html#hobbies" target="_self" rel="noopener">Back to Hobbies</a>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-close" id="lightboxClose">×</div>
    <img id="lightboxImage" src="" alt="Enlarged drawing image">
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxClose = document.getElementById('lightboxClose');

    document.querySelectorAll('.gallery-item img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImage.src = img.src;
        lightboxImage.alt = img.alt;
        lightbox.classList.add('active');
      });
    });

    const closeLightbox = () => {
      lightbox.classList.remove('active');
      lightboxImage.src = '';
    };

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
    });
  </script>
</body>
</html>
